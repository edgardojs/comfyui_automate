version: "3.8"

services:
  postgres:
    image: postgres:16.9-alpine
    container_name: sprite_prompt_db
    env_file:
      - .env
    ports:
      # Only expose to localhost; remove the mapping entirely for production
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprite_user -d sprite_prompt_generator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: