services:
  postgres:
    image: postgres:16.9-alpine
    container_name: sprite_prompt_db
    env_file:
      - .env
    ports:
      # Only expose to localhost; remove the mapping entirely for production
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sprite_user} -d $${POSTGRES_DB:-sprite_prompt_generator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sprite_prompt_api
    env_file:
      - .env
    environment:
      SPRITE_PROJECTS_DIR: /app/sprite_projects
      CORS_ORIGINS: http://localhost:8080
    expose:
      - "8000"
    volumes:
      - sprite_projects_data:/app/sprite_projects
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sprite_prompt_web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app_network

volumes:
  pgdata:
  sprite_projects_data:

networks:
  app_network:
    driver: bridge