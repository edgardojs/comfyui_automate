# Alembic configuration for database migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend for imports
prepend_sys_path = .

# Timezone for the revision timestamp
# timezone = UTC

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .hierarchical revision numbering
# version_path_separator = os.pathsep

# The output encoding used when revision files are written
# output_encoding = utf-8

# Database URL - uses the same DATABASE_URL as the application
# This can be overridden with the DATABASE_URL environment variable
sqlalchemy.url = postgresql+asyncpg://sprite_user:sprite_pass@localhost:5432/sprite_prompt_generator

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S